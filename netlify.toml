[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirecionamento SPA para React Router / client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache longo e imutável para assets estáticos com hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# MIME type correto e headers para WebAssembly (.wasm)
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"
