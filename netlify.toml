[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 exige Node ^20.19 ou >=22.12.
  NODE_VERSION = "22"

[[headers]]
  for = "/stockfish/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
